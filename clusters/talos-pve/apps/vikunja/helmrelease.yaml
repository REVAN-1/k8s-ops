apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: vikunja
spec:
  interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true 
  releaseName: vikunja
  chart:
    spec:
      chart: vikunja
      version: "2.3.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: vikunja-secrets
      valuesKey: values.yaml
  values:
    vikunja:
      image:
        repository: vikunja/vikunja       
        tag: "unstable@sha256:4175f216be1d39f4f19189a5a1db933e7cb72cefe26b572b9b8bd42697cab532"
      persistence:
        data:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /app/vikunja/files
        database:
          enabled: false
        config:
          type: secret
          name: vikunja-config
      ingress:
        main:
          enabled: true
          hosts:
            - host: board.k8s.exmaple.com
              paths:
                - path: /
          tls:
            - hosts:
                - board.k8s.exmaple.com

      configMaps:
        config:
          enabled: false

      env: 
        VIKUNJA_SERVICE_PUBLICURL: "https://board.k8s.exmaple.com"
        VIKUNJA_DATABASE_HOST: "vikunja-db-rw"
        VIKUNJA_DATABASE_TYPE: "postgres"
        VIKUNJA_DATABASE_USER: "vikunja"
        VIKUNJA_DATABASE_DATABASE: "vikunja"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
