---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seerr
  namespace: flux-system
spec:
  image: ghcr.io/seerr-team/seerr
  interval: 10m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seerr
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: seerr
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '3.5.x'