apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true 
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: "5.2.1"
  values:
    controllers:
      sonarr:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "false"
        pod:
          securityContext:
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app: 
            image:
              repository: ghcr.io/hotio/sonarr
              tag: "latest"
            env:
              TZ: Europe/Berlin
              PUID: 0
              PGID: 0
            securityContext:
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 768Mi

    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989

          
    persistence:
      config:
        existingClaim: sonarr-config
        advancedMounts:
          sonarr:
            app:
              - path: /config  

      data:
        type: nfs
        server: 192.168.178.118
        path: /mnt/zfs-pool/media/video/serien
        globalMounts:
          - path: /data

      download:
        type: nfs
        server: 192.168.178.118
        path: /mnt/zfs-pool/media/downloads/sabnzb/serien
        globalMounts:
          - path: /downloads/serien

    ingress:
      app:
        className: "cilium"
        hosts:
          - host: "sonarr.k8s.exmaple.com"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - "sonarr.k8s.exmaple.com"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-rbd-sc
  resources:
    requests:
      storage: 2Gi 