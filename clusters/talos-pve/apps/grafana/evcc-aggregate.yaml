apiVersion: v1
kind: ConfigMap
metadata:
  name: evcc-influx-aggregate-config
  namespace: grafana
data:
  evcc-influx-aggregate.conf: |
    INFLUX_EVCC_DB="evcc"
    INFLUX_EVCC_USER="${INFLUX_EVCC_USER}"
    INFLUX_EVCC_PASSWORD="${INFLUX_EVCC_PASSWORD}"

    INFLUX_AGGR_DB="evcc_aggr"
    INFLUX_AGGR_USER="${INFLUX_AGGR_USER}"
    INFLUX_AGGR_PASSWORD="${INFLUX_AGGR_PASSWORD}"

    INFLUX_HOST="influxdb-v1"
    INFLUX_PORT=8086

    PEAK_POWER_LIMIT=25000
    HOME_BATTERY="true"
    DYNAMIC_TARIFF="false"

    TIMEZONE="Europe/Berlin"
    ENERGY_SAMPLE_INTERVAL="60s"
    TARIFF_PRICE_INTERVAL="15m"

    DEBUG="false"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: evcc-influx-aggregate-today
  namespace: grafana
spec:
  schedule: "0 * * * *"
  timeZone: "Europe/Berlin"

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400

      template:
        metadata:
          labels:
            app.kubernetes.io/name: evcc-influx-aggregate
        spec:
          restartPolicy: Never

          containers:
            - name: aggregate
              image: registry.k8s.exmaple.com/custom-container/evcc-aggregate:latest
              imagePullPolicy: IfNotPresent

              args:
                - "--today"

              envFrom:
                - secretRef:
                    name: evcc-influx-aggregate-auth

              env:
                - name: TZ
                  value: Europe/Berlin

              volumeMounts:
                - name: config
                  mountPath: /opt/evcc-aggregate/evcc-influx-aggregate.conf
                  subPath: evcc-influx-aggregate.conf
                  readOnly: true

              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 256Mi

          volumes:
            - name: config
              configMap:
                name: evcc-influx-aggregate-config
                defaultMode: 0444
---
