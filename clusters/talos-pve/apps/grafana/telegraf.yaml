apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telegraf-pv
  namespace: grafana
spec:
  interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true 
  chart:
    spec:
      chart: telegraf
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
      version: "1.8.77"
  values:
    tplVersion: 2
    config:
      agent:
        interval: "10s"
        round_interval: true
        metric_batch_size: 1000
        metric_buffer_limit: 10000
        collection_jitter: "0s"
        flush_interval: "10s"
        flush_jitter: "0s"
        precision: ""
        debug: false
        quiet: false
        logfile: ""
        hostname: "${HOSTNAME}"
        omit_hostname: false

      inputs:
        - modbus:
            name: "solaredge-inverter"
            name_override: "solaredge"

            controller: "tcp://192.168.178.232:1502"
            transmission_mode: "TCP"
            configuration_type: "request"
            timeout: "5s"

            exclude_register_type_tag: true

            request:
              - slave_id: 1
                register: "holding"
                byte_order: "ABCD"
                measurement: "solaredge"
                optimization: "shrink"

                fields:
                  - address: 40071
                    name: "ac_current_raw"
                    type: "UINT16"

                  - address: 40075
                    name: "ac_current_sf"
                    type: "INT16"

                  - address: 40083
                    name: "ac_power_raw"
                    type: "INT16"

                  - address: 40084
                    name: "ac_power_sf"
                    type: "INT16"

                  - address: 40085
                    name: "ac_frequency_raw"
                    type: "UINT16"

                  - address: 40086
                    name: "ac_frequency_sf"
                    type: "INT16"

                  - address: 40093
                    name: "ac_energy_wh_raw"
                    type: "UINT32"

                  - address: 40095
                    name: "ac_energy_wh_sf"
                    type: "INT16"

                  - address: 40096
                    name: "dc_current_raw"
                    type: "UINT16"

                  - address: 40097
                    name: "dc_current_sf"
                    type: "INT16"

                  - address: 40098
                    name: "dc_voltage_raw"
                    type: "UINT16"

                  - address: 40099
                    name: "dc_voltage_sf"
                    type: "INT16"

                  - address: 40100
                    name: "dc_power_raw"
                    type: "INT16"

                  - address: 40101
                    name: "dc_power_sf"
                    type: "INT16"

                  - address: 40103
                    name: "temperature_raw"
                    type: "INT16"

                  - address: 40106
                    name: "temperature_sf"
                    type: "INT16"

                  - address: 40107
                    name: "status"
                    type: "UINT16"

              - slave_id: 2
                register: "holding"
                byte_order: "ABCD"
                measurement: "solaredge"
                optimization: "shrink"

                fields:
                  - address: 40071
                    name: "ac_current_raw"
                    type: "UINT16"

                  - address: 40075
                    name: "ac_current_sf"
                    type: "INT16"

                  - address: 40083
                    name: "ac_power_raw"
                    type: "INT16"

                  - address: 40084
                    name: "ac_power_sf"
                    type: "INT16"

                  - address: 40085
                    name: "ac_frequency_raw"
                    type: "UINT16"

                  - address: 40086
                    name: "ac_frequency_sf"
                    type: "INT16"

                  - address: 40093
                    name: "ac_energy_wh_raw"
                    type: "UINT32"

                  - address: 40095
                    name: "ac_energy_wh_sf"
                    type: "INT16"

                  - address: 40096
                    name: "dc_current_raw"
                    type: "UINT16"

                  - address: 40097
                    name: "dc_current_sf"
                    type: "INT16"

                  - address: 40098
                    name: "dc_voltage_raw"
                    type: "UINT16"

                  - address: 40099
                    name: "dc_voltage_sf"
                    type: "INT16"

                  - address: 40100
                    name: "dc_power_raw"
                    type: "INT16"

                  - address: 40101
                    name: "dc_power_sf"
                    type: "INT16"

                  - address: 40103
                    name: "temperature_raw"
                    type: "INT16"

                  - address: 40106
                    name: "temperature_sf"
                    type: "INT16"

                  - address: 40107
                    name: "status"
                    type: "UINT16"

      processors:
        - starlark:
            namepass:
              - "solaredge"

            source: |
              load("math.star", "math")

              def calculate(fields, raw_name, sf_name):
                  if raw_name not in fields or sf_name not in fields:
                      return None

                  sf = fields[sf_name]

                  # Ungültige beziehungsweise nicht implementierte
                  # SunSpec-Skalierungsfaktoren verwerfen.
                  if sf < -10 or sf > 10:
                      return None

                  return float(fields[raw_name]) * math.pow(10.0, float(sf))

              def apply(metric):
                  fields = metric.fields

                  mappings = [
                      ("ac_current_raw", "ac_current_sf", "ac_current_a"),
                      ("ac_power_raw", "ac_power_sf", "ac_power_w"),
                      ("ac_frequency_raw", "ac_frequency_sf", "ac_frequency_hz"),
                      ("ac_energy_wh_raw", "ac_energy_wh_sf", "ac_energy_wh"),
                      ("dc_current_raw", "dc_current_sf", "dc_current_a"),
                      ("dc_voltage_raw", "dc_voltage_sf", "dc_voltage_v"),
                      ("dc_power_raw", "dc_power_sf", "dc_power_w"),
                      ("temperature_raw", "temperature_sf", "temperature_c"),
                  ]

                  for raw_name, sf_name, result_name in mappings:
                      value = calculate(fields, raw_name, sf_name)
                      if value != None:
                          fields[result_name] = value

                  return metric

      outputs:
        - prometheus_client:
            listen: ":9273"
            path: "/metrics"
            expiration_interval: "30s"

    resources:
     requests:
       memory: 128Mi
       cpu: 100m
     limits:
       memory: 512Mi
       cpu: 200m
    pdb:
      create: false

