apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: influxdb-v1
  namespace: grafana
spec:
  interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true 
  chart:
    spec:
      chart: influxdb
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
      version: "4.12.5"
  values:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi
    persistence:
      enabled: true
      storageClass: "csi-rbd-sc"
      accessMode: ReadWriteOnce
      size: 8Gi
    setDefaultUser:
      enabled: false
      user:
        existingSecret: influxdb-auth
    ingress:
      enabled: true
      tls: false
      hostname: influxdb-v1.k8s.exmaple.com
      className: cilium
    env:
      - name: INFLUXDB_DB
        value: "evcc"
    backup:
      enabled: true
      persistence:
        enabled: false
      schedule: "0 9 * * *"
      s3:
        credentialsSecret: s3-influx-credentials
        destination: s3://influxdb/evcc
        endpointUrl: "https://s3.int.exmaple.com"