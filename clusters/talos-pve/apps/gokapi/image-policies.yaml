---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gokapi
  namespace: flux-system
spec:
  image: docker.io/f0rc3/gokapi
  interval: 10m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gokapi
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gokapi
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '2.2.x'