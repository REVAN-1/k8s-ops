when:
  event:
    - push
    - pull_request

steps:
  - name: check-sops-secrets
    image: alpine:3
    commands:
      - |
        set -u

        find ./clusters \
          -type f \
          \( -name 'secrets.yaml' -o -name '*.sops.yaml' \) \
          ! -name '.sops.yaml' \
          -print > /tmp/sops-files

        if [ ! -s /tmp/sops-files ]; then
          echo "ERROR: No SOPS secret files found"
          exit 1
        fi

        failed=0

        while IFS= read -r file; do
          echo "Checking $file"

          if ! grep -q '^sops:' "$file"; then
            echo "ERROR: $file does not appear to be SOPS encrypted"
            failed=1
          fi
        done < /tmp/sops-files

        exit "$failed"

